name: Release ViKey

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app bundle
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash Scripts/build-app.sh

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/ViKey.app "dist/ViKey-${{ github.ref_name }}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ViKey-${{ github.ref_name }}.zip